<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Poppins, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Arquitectura de Docker</title>
  <desc>El cliente docker se comunica por API con dockerd. Dentro del anfitrión Linux, dockerd delega en containerd, que usa containerd-shim y runc para crear contenedores aislados con namespaces y cgroups del kernel. Las imágenes se descargan o suben a un registro.</desc>

  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b5a7a"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="20" fill="#ffffff"/>

  <rect x="47" y="35" width="150" height="65" rx="10" fill="#2496ED"/>
  <text x="122" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Cliente docker</text>
  <text x="122" y="84" text-anchor="middle" font-size="11" fill="#ffffff">CLI</text>

  <rect x="600" y="35" width="170" height="65" rx="10" fill="#EC4899"/>
  <text x="685" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Registro</text>
  <text x="685" y="84" text-anchor="middle" font-size="11" fill="#ffffff">Docker Hub u otro</text>

  <rect x="30" y="130" width="740" height="250" rx="16" fill="#f4f1ff" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="750" y="153" text-anchor="end" font-size="13" font-weight="600" fill="#7C3AED">Anfitrión Linux</text>

  <line x1="122" y1="102" x2="122" y2="178" stroke="#5b5a7a" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="134" y="124" font-size="11" fill="#5b5a7a">API REST</text>
  <line x1="685" y1="102" x2="685" y2="128" stroke="#5b5a7a" stroke-width="2" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
  <text x="697" y="120" font-size="11" fill="#5b5a7a">pull / push</text>

  <rect x="50" y="180" width="145" height="70" rx="10" fill="#EC4899"/>
  <text x="122" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">dockerd</text>
  <text x="122" y="231" text-anchor="middle" font-size="11" fill="#ffffff">Docker Daemon</text>

  <rect x="235" y="180" width="145" height="70" rx="10" fill="#7C3AED"/>
  <text x="307" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">containerd</text>
  <text x="307" y="231" text-anchor="middle" font-size="11" fill="#ffffff">ciclo de vida</text>

  <rect x="420" y="180" width="145" height="70" rx="10" fill="#7C3AED"/>
  <text x="492" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">containerd-shim</text>
  <text x="492" y="231" text-anchor="middle" font-size="11" fill="#ffffff">supervisa</text>

  <rect x="605" y="180" width="145" height="70" rx="10" fill="#2496ED"/>
  <text x="677" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">runc</text>
  <text x="677" y="231" text-anchor="middle" font-size="11" fill="#ffffff">crea (OCI)</text>

  <line x1="195" y1="215" x2="233" y2="215" stroke="#5b5a7a" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="380" y1="215" x2="418" y2="215" stroke="#5b5a7a" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="565" y1="215" x2="603" y2="215" stroke="#5b5a7a" stroke-width="2" marker-end="url(#flecha)"/>

  <rect x="50" y="290" width="340" height="70" rx="10" fill="#1e1b4b"/>
  <text x="220" y="319" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Kernel de Linux</text>
  <text x="220" y="340" text-anchor="middle" font-size="12" fill="#cfcdf0">namespaces · cgroups</text>

  <line x1="677" y1="252" x2="677" y2="288" stroke="#5b5a7a" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="420" y="290" width="330" height="70" rx="10" fill="#e0f2ff" stroke="#2496ED" stroke-width="2"/>
  <rect x="432" y="305" width="96" height="40" rx="8" fill="#2496ED"/>
  <text x="480" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Contenedor</text>
  <rect x="537" y="305" width="96" height="40" rx="8" fill="#2496ED"/>
  <text x="585" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Contenedor</text>
  <rect x="642" y="305" width="96" height="40" rx="8" fill="#2496ED"/>
  <text x="690" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Contenedor</text>

  <line x1="418" y1="325" x2="392" y2="325" stroke="#5b5a7a" stroke-width="2" marker-end="url(#flecha)"/>
</svg>
