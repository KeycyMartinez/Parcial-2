<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Poppins, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Máquina virtual frente a contenedor</title>
  <desc>A la izquierda, una máquina virtual con aplicaciones, sistema operativo invitado, hipervisor y hardware. A la derecha, contenedores con aplicaciones, librerías, Docker Engine, sistema operativo anfitrión y hardware.</desc>

  <rect width="800" height="400" rx="20" fill="#ffffff"/>

  <line x1="400" y1="30" x2="400" y2="370" stroke="#e4e0f7" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="205" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b4b">Máquina virtual</text>

  <rect x="40" y="70" width="160" height="50" rx="8" fill="#2496ED"/>
  <text x="120" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">App A</text>
  <rect x="210" y="70" width="160" height="50" rx="8" fill="#2496ED"/>
  <text x="290" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">App B</text>

  <rect x="40" y="125" width="160" height="110" rx="8" fill="#e9e5ff" stroke="#7C3AED" stroke-width="2"/>
  <text x="120" y="173" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">SO invitado</text>
  <text x="120" y="194" text-anchor="middle" font-size="12" fill="#5b5a7a">(kernel propio)</text>
  <rect x="210" y="125" width="160" height="110" rx="8" fill="#e9e5ff" stroke="#7C3AED" stroke-width="2"/>
  <text x="290" y="173" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">SO invitado</text>
  <text x="290" y="194" text-anchor="middle" font-size="12" fill="#5b5a7a">(kernel propio)</text>

  <rect x="40" y="245" width="330" height="50" rx="8" fill="#7C3AED"/>
  <text x="205" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Hipervisor</text>

  <rect x="40" y="305" width="330" height="50" rx="8" fill="#1e1b4b"/>
  <text x="205" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Hardware</text>

  <text x="595" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#1e1b4b">Contenedores</text>

  <rect x="430" y="70" width="104" height="50" rx="8" fill="#2496ED"/>
  <text x="482" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">App A</text>
  <rect x="543" y="70" width="104" height="50" rx="8" fill="#2496ED"/>
  <text x="595" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">App B</text>
  <rect x="656" y="70" width="104" height="50" rx="8" fill="#2496ED"/>
  <text x="708" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">App C</text>

  <rect x="430" y="125" width="104" height="50" rx="8" fill="#e9e5ff" stroke="#7C3AED" stroke-width="2"/>
  <text x="482" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Librerías</text>
  <rect x="543" y="125" width="104" height="50" rx="8" fill="#e9e5ff" stroke="#7C3AED" stroke-width="2"/>
  <text x="595" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Librerías</text>
  <rect x="656" y="125" width="104" height="50" rx="8" fill="#e9e5ff" stroke="#7C3AED" stroke-width="2"/>
  <text x="708" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1b4b">Librerías</text>

  <rect x="430" y="185" width="330" height="50" rx="8" fill="#EC4899"/>
  <text x="595" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Docker Engine</text>

  <rect x="430" y="245" width="330" height="50" rx="8" fill="#7C3AED"/>
  <text x="595" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">SO anfitrión (kernel compartido)</text>

  <rect x="430" y="305" width="330" height="50" rx="8" fill="#1e1b4b"/>
  <text x="595" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Hardware</text>

  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#5b5a7a">Cada VM carga su propio sistema operativo · Los contenedores comparten el kernel del anfitrión</text>
